// WatchRSS application policy only. Keep the framework host manifest intact,
// including its Activity/takeover metadata, then override the library permission.
allprojects { afterEvaluate { p ->
    if (p.name == 'androidApp') {
        def android = p.extensions.getByName('android')
        def original = android.sourceSets.main.manifest.srcFile
        def text = original.getText('UTF-8')
        if (!text.contains('xmlns:tools=')) {
            text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ')
        }
        def output = new File(gradle.gradleUserHomeDir, 'watchrss-host-manifest.xml')
        output.setText(text.replace('</manifest>', '<uses-permission android:name="android.permission.RECORD_AUDIO" tools:node="remove" /></manifest>'), 'UTF-8')
        android.sourceSets.main.manifest.srcFile(output)
    }
} }
