plugins { id 'com.android.application' }
android {
 namespace 'dev.podjs.hotfix'
 compileSdk 36
 defaultConfig { applicationId 'com.lightningstudio.watchrss.takeover.hotfixtest'; minSdk 30; targetSdk 36; versionCode 1; versionName 'takeover-hotfix-test' }
 sourceSets.main.assets.srcDir(System.getProperty('watchrss.hotfixCaDir'))
}
dependencies { implementation 'androidx.security:security-crypto:1.1.0-alpha06'; implementation 'androidx.tracing:tracing:1.2.0'; implementation 'androidx.test:runner:1.7.0'; implementation 'androidx.test.ext:junit:1.3.0' }

configurations.configureEach { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0', 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2', 'androidx.annotation:annotation-jvm:1.9.1' }
